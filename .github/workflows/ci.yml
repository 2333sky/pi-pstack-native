name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Source checks, semantic compatibility gates and tests
        run: npm run check
      - name: Typecheck
        run: npm run check:types
      - name: Build
        run: npm run build
      - name: Pi SDK smoke (no live LLM)
        run: npm run check:host
      - name: Offline benchmark integrity smoke
        run: npm run benchmark:smoke
      - name: End-to-end gates (offline and fake provider)
        run: npm run check:e2e
      - name: Installed package smoke
        run: npm run smoke:installed

  statechart:
    name: Statechart toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Fetch pinned TLC and verify its checksum
        env:
          TLA2TOOLS: ${{ runner.temp }}/statechart-tools/tla2tools.jar
        shell: bash
        run: |
          mkdir -p "$(dirname "$TLA2TOOLS")"
          curl --fail --location --retry 2 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$TLA2TOOLS"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS" | sha256sum --check
      - name: Run upstream statechart regression suite
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/statechart-cache
          TLA2TOOLS: ${{ runner.temp }}/statechart-tools/tla2tools.jar
        run: npm run test:statechart
